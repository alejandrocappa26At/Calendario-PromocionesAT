            /* ---------- Partículas de fuego y chispas (Canvas) ---------- */
            const canvas = document.getElementById('hwCanvas');
            const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
            const PALETTE = [
                [255, 150, 40],  // fuego naranja
                [255, 200, 80],  // ámbar
                [255, 90, 30],   // rojo fuego
                [180, 80, 255]   // violeta
            ];
            const CYAN = [0, 217, 255];
            const TAU = Math.PI * 2;

            let particles = [];
            let rafId = null;
            let running = false;
            let W = 0, H = 0;

            function targetCount() {
                if (mqReduce.matches) return 0;
                const base = mqSmall.matches ? 34 : 76;
                const factor = Math.min(1, (W * H) / (1280 * 720));
                return Math.max(14, Math.round(base * factor));
            }

            function makeParticle(fromBottom) {
                const isCyan = Math.random() < 0.07;
                const col = isCyan ? CYAN : PALETTE[(Math.random() * PALETTE.length) | 0];
                const big = Math.random() < 0.16;
                return {
                    x: Math.random() * W,
                    y: fromBottom ? H + Math.random() * 40 : Math.random() * H,
                    r: big ? rnd(2.1, 4.4) : rnd(0.7, 2.1),
                    vx: rnd(-0.12, 0.12),
                    vy: -(0.16 + Math.random() * 0.55),
                    sway: Math.random() * TAU,
                    swaySpeed: rnd(0.006, 0.022),
                    swayAmp: rnd(0.15, 0.9),
                    life: 0,
                    maxLife: rnd(200, 620),
                    col: col
                };
            }

            function seed() {
                particles = [];
                const n = targetCount();
                for (let i = 0; i < n; i++) particles.push(makeParticle(false));
            }

            function resize() {
                if (!ctx) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = scene.clientWidth || window.innerWidth;
                H = scene.clientHeight || window.innerHeight;
                canvas.width = Math.max(1, Math.floor(W * dpr));
                canvas.height = Math.max(1, Math.floor(H * dpr));
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function step() {
                if (!ctx) return;
                ctx.clearRect(0, 0, W, H);
                ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.life++;
                    p.sway += p.swaySpeed;
                    p.x += p.vx + Math.cos(p.sway) * p.swayAmp * 0.22;
                    p.y += p.vy;

                    if (p.y < -20 || p.life > p.maxLife) {
                        particles[i] = makeParticle(true);
                        continue;
                    }

                    const t = p.life / p.maxLife;
                    const a = Math.sin(Math.min(1, t) * Math.PI) * 0.9; // aparece y desaparece
                    const c = p.col;

                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * 0.85).toFixed(3) + ')';
                    ctx.arc(p.x, p.y, p.r, 0, TAU);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(' + c[0] + ',' + Math.round(c[1] * 0.55) + ',' + Math.round(c[2] * 0.3) + ',' + (a * 0.1).toFixed(3) + ')';
                    ctx.arc(p.x, p.y, p.r * 3.4, 0, TAU);
                    ctx.fill();
                }
                rafId = requestAnimationFrame(step);
            }

            function start() {
                if (!ctx || running || mqReduce.matches) return;
                running = true;
                resize();
                seed();
                rafId = requestAnimationFrame(step);
            }

            function stop() {
                running = false;
                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                if (ctx && W && H) ctx.clearRect(0, 0, W, H);
            }

            /* Resize con debounce */
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (!running) return;
                    resize();
                    seed();
                }, 220);
            });

            /* Pausa al ocultar la pestaña (ahorro de recursos) */
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stop();
                else start();
            });

            /* Reacción a cambios en prefers-reduced-motion */
            function onReduceChange() {
                buildBats();
                if (mqReduce.matches) stop();
                else start();
            }
            if (mqReduce.addEventListener) mqReduce.addEventListener('change', onReduceChange);
            else if (mqReduce.addListener) mqReduce.addListener(onReduceChange);

            if (document.readyState === 'complete') start();
            else window.addEventListener('load', start);
        })();
