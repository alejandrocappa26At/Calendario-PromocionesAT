        /* =====================================================================
           HALLOWEEN CINEMATOGRÁFICO — AMBIENTACIÓN PREMIUM
           Capa decorativa fija (z-index:-1, pointer-events:none). No bloquea
           clics ni lectura. Solo anima transform/opacity. Respeta
           prefers-reduced-motion y reduce efectos en móviles.
           ===================================================================== */
        .halloween-scene {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            animation: hwSceneIn 1.6s ease 0.15s forwards;
            --hw-orange: #ff7a18;
            --hw-amber: #ffb703;
            --hw-red: #ff2d2d;
            --hw-purple: #7b2ff7;
            --hw-cyan: #00d9ff;
        }

        @keyframes hwSceneIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ---------- Niebla / humo en capas (parallax de profundidad) ---------- */
        .hw-fog {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform;
        }

        .hw-fog--1 {
            width: 74vw;
            height: 62vh;
            left: -22vw;
            top: 18vh;
            background: radial-gradient(circle, rgba(124, 58, 190, 0.26), transparent 70%);
            animation: hwFog1 52s ease-in-out infinite alternate;
        }

        .hw-fog--2 {
            width: 84vw;
            height: 56vh;
            right: -26vw;
            top: 2vh;
            background: radial-gradient(circle, rgba(255, 122, 24, 0.16), transparent 70%);
            animation: hwFog2 64s ease-in-out infinite alternate;
        }

        .hw-fog--3 {
            width: 92vw;
            height: 52vh;
            left: -12vw;
            bottom: -18vh;
            background: radial-gradient(circle, rgba(70, 74, 120, 0.20), transparent 72%);
            animation: hwFog3 74s ease-in-out infinite alternate;
        }

        @keyframes hwFog1 {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }

            to {
                transform: translate3d(15vw, -5vh, 0) scale(1.14);
            }
        }

        @keyframes hwFog2 {
            from {
                transform: translate3d(0, 4vh, 0) scale(1.08);
            }

            to {
                transform: translate3d(-13vw, -4vh, 0) scale(1);
            }
        }

        @keyframes hwFog3 {
            from {
                transform: translate3d(-6vw, 0, 0) scale(1);
            }

            to {
                transform: translate3d(11vw, -7vh, 0) scale(1.12);
            }
        }

        /* ---------- Resplandores ambientales ---------- */
        .hw-glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            will-change: opacity;
        }

        .hw-glow--orange {
            width: 62vmax;
            height: 62vmax;
            left: -18vmax;
            bottom: -24vmax;
            background: radial-gradient(circle, rgba(255, 110, 20, 0.22), transparent 62%);
            animation: hwGlowA 11s ease-in-out infinite alternate;
        }

        .hw-glow--purple {
            width: 58vmax;
            height: 58vmax;
            right: -20vmax;
            top: -22vmax;
            background: radial-gradient(circle, rgba(123, 47, 247, 0.20), transparent 64%);
            animation: hwGlowB 14s ease-in-out infinite alternate;
        }

        .hw-glow--red {
            width: 46vmax;
            height: 46vmax;
            right: 6vw;
            bottom: -16vmax;
            background: radial-gradient(circle, rgba(255, 45, 45, 0.16), transparent 66%);
            animation: hwGlowA 9.5s ease-in-out infinite alternate;
            animation-delay: -3s;
        }

        @keyframes hwGlowA {

            0%,
            100% {
                opacity: 0.34;
            }

            50% {
                opacity: 0.66;
            }
        }

        @keyframes hwGlowB {

            0%,
            100% {
                opacity: 0.28;
            }

            50% {
                opacity: 0.58;
            }
        }

        /* ---------- Canvas de partículas (fuego / chispas) ---------- */
        .hw-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ---------- Murciélagos ---------- */
        .hw-bat-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hw-bat {
            position: absolute;
            left: 0;
            will-change: transform;
            animation: hwBatTraverse var(--dur, 38s) linear infinite;
        }

        .hw-bat--rev {
            animation-name: hwBatTraverseRev;
        }

        @keyframes hwBatTraverse {
            from {
                transform: translateX(-18vw);
            }

            to {
                transform: translateX(118vw);
            }
        }

        @keyframes hwBatTraverseRev {
            from {
                transform: translateX(118vw);
            }

            to {
                transform: translateX(-18vw);
            }
        }

        .hw-bat-fly {
            animation: hwBatBob 4.4s ease-in-out infinite alternate;
        }

        @keyframes hwBatBob {
            from {
                transform: translateY(-2.4vh) rotate(-5deg);
            }

            to {
                transform: translateY(2.8vh) rotate(6deg);
            }
        }

        .hw-bat-svg {
            display: block;
            width: var(--size, 40px);
            height: auto;
            transform: scale(var(--scale, 1));
            transform-origin: center;
            filter: drop-shadow(0 0 8px rgba(255, 110, 40, 0.55)) drop-shadow(0 0 18px rgba(123, 47, 247, 0.42));
        }

        .hw-bat--rev .hw-bat-svg {
            transform: scaleX(-1) scale(var(--scale, 1));
        }

        .hw-bat-wing {
            transform-box: fill-box;
        }

        .hw-bat-wing--l {
            transform-origin: 100% 42%;
            animation: hwFlap .3s ease-in-out infinite alternate;
        }

        .hw-bat-wing--r {
            transform-origin: 0% 42%;
            animation: hwFlapR .3s ease-in-out infinite alternate;
        }

        @keyframes hwFlap {
            from {
                transform: scaleY(1);
            }

            to {
                transform: scaleY(0.42);
            }
        }

        @keyframes hwFlapR {
            from {
                transform: scaleY(1);
            }

            to {
                transform: scaleY(0.42);
            }
        }

        /* ---------- Telarañas con gotas de agua y brillo ---------- */
        .hw-web {
            position: absolute;
            pointer-events: none;
            color: #cfd6e4;
            width: clamp(120px, 16vw, 260px);
            height: clamp(120px, 16vw, 260px);
            animation: hwWebIn 2.2s ease 0.6s backwards;
        }

        .hw-web-svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .hw-web--tl {
            top: -2px;
            left: -2px;
        }

        .hw-web--tr {
            top: -2px;
            right: -2px;
            transform: scaleX(-1);
        }

        .hw-web-strands {
            opacity: 0.42;
            transition: opacity 0.3s ease;
        }

        /* Gotas de agua: volumen, halo cristalino y refracción */
        .hw-web-dewdrops {
            opacity: 0.96;
            pointer-events: none;
            filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 3.5px rgba(135, 215, 255, 0.75)) drop-shadow(0 0 7px rgba(70, 180, 255, 0.4));
        }

        .hw-web--inline-tl {
            top: 0;
            left: 0;
            width: clamp(64px, 7vw, 120px);
            height: clamp(64px, 7vw, 120px);
            border-top-left-radius: inherit;
        }

        .hw-web--inline-tl .hw-web-strands,
        .hw-web--inline-tr .hw-web-strands {
            opacity: 0.26;
        }

        .hw-web--inline-tl .hw-web-dewdrops,
        .hw-web--inline-tr .hw-web-dewdrops {
            opacity: 0.85;
        }

        .hw-web--inline-tr {
            top: 0;
            right: 0;
            width: clamp(64px, 7vw, 120px);
            height: clamp(64px, 7vw, 120px);
            transform: scaleX(-1);
            border-top-right-radius: inherit;
        }

        @keyframes hwWebIn {
            from {
                opacity: 0;
                transform: scale(0.6);
            }
        }

        /* Animación de titileo / brillo orgánico de las gotas de agua */
        .hw-dew {
            transform-box: fill-box;
            transform-origin: center;
            animation: hwDewGlisten 3.5s ease-in-out infinite alternate;
        }

        .hw-dew--g1 {
            animation-delay: 0s;
            animation-duration: 3.2s;
        }

        .hw-dew--g2 {
            animation-delay: 0.8s;
            animation-duration: 2.7s;
        }

        .hw-dew--g3 {
            animation-delay: 1.6s;
            animation-duration: 3.8s;
        }

        .hw-dew--g4 {
            animation-delay: 2.3s;
            animation-duration: 3.1s;
        }

        .hw-dew--g5 {
            animation-delay: 1.2s;
            animation-duration: 4.2s;
        }

        /* Destellos vivos tipo diamante en gotas de agua principales */
        .hw-dew-sparkle {
            transform-box: fill-box;
            transform-origin: center;
            opacity: 0;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 5px rgba(180, 240, 255, 0.95));
            animation: hwDewSparkle 5s ease-in-out infinite;
        }

        .hw-dew-sparkle--1 {
            animation-delay: 0.3s;
        }

        .hw-dew-sparkle--2 {
            animation-delay: 1.8s;
        }

        .hw-dew-sparkle--3 {
            animation-delay: 3.1s;
        }

        .hw-dew-sparkle--4 {
            animation-delay: 4.2s;
        }

        .hw-dew-sparkle--5 {
            animation-delay: 2.5s;
        }

        @keyframes hwDewGlisten {

            0%,
            100% {
                opacity: 0.65;
                transform: scale(0.94);
            }

            50% {
                opacity: 1;
                transform: scale(1.18);
            }
        }

        @keyframes hwDewSparkle {

            0%,
            24%,
            100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }

            10% {
                opacity: 1;
                transform: scale(1.3) rotate(45deg);
            }

            15% {
                opacity: 0.85;
                transform: scale(0.95) rotate(75deg);
            }

            20% {
                opacity: 0;
                transform: scale(0.1) rotate(110deg);
            }
        }

        /* ---------- Arañas descendiendo ---------- */
        .hw-spider {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            will-change: transform;
        }

        .hw-spider--1 {
            left: 17%;
            animation: hwSpiderDrop 15s ease-in-out infinite;
        }

        .hw-spider--2 {
            left: 76%;
            animation: hwSpiderDrop 19s ease-in-out infinite;
            animation-delay: -7s;
        }

        .hw-spider-thread {
            width: 1px;
            height: 24vh;
            background: linear-gradient(rgba(226, 232, 240, 0), rgba(226, 232, 240, 0.34));
        }

        .hw-spider-body {
            width: 26px;
            height: 26px;
            color: #0e0b16;
            transform-origin: 50% 0%;
            animation: hwSpiderSwing 5.5s ease-in-out infinite alternate;
        }

        .hw-spider-body svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes hwSpiderDrop {
            0% {
                transform: translateY(-34px);
            }

            45% {
                transform: translateY(30vh);
            }

            55% {
                transform: translateY(30vh);
            }

            100% {
                transform: translateY(-34px);
            }
        }

        @keyframes hwSpiderSwing {
            from {
                transform: rotate(-7deg);
            }

            to {
                transform: rotate(7deg);
            }
        }

        /* ---------- Calabazas iluminadas ---------- */
        .hw-pumpkin {
            position: absolute;
            bottom: -6px;
            width: clamp(96px, 11vw, 176px);
            pointer-events: none;
        }

        .hw-pumpkin--left {
            left: 2vw;
        }

        .hw-pumpkin--right {
            right: 2vw;
        }

        .hw-pumpkin-svg {
            position: relative;
            width: 100%;
            height: auto;
            display: block;
            z-index: 1;
            filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.55));
        }

        .hw-pumpkin-glow {
            position: absolute;
            left: 50%;
            top: 40%;
            width: 160%;
            height: 130%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 140, 30, 0.5), transparent 65%);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: hwPumpkinBreath 5.6s ease-in-out infinite;
        }

        .hw-pumpkin-face {
            animation: hwFaceFlicker 3.8s ease-in-out infinite;
        }

        @keyframes hwPumpkinBreath {

            0%,
            100% {
                opacity: 0.48;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.09);
            }
        }

        @keyframes hwFaceFlicker {

            0%,
            100% {
                opacity: 0.82;
            }

            38% {
                opacity: 1;
            }

            58% {
                opacity: 0.68;
            }

            76% {
                opacity: 0.95;
            }
        }

        /* ---------- Velas y fuego ---------- */
        .hw-candle {
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .hw-candle--left {
            left: 15vw;
        }

        .hw-candle--right {
            right: 15vw;
        }

        .hw-candle-body {
            width: clamp(16px, 1.6vw, 22px);
            height: clamp(58px, 7vw, 92px);
            margin-top: -4px;
            border-radius: 5px 5px 3px 3px;
            background: linear-gradient(90deg, #33271f, #6b5544 42%, #cbb18b 52%, #6b5544 62%, #33271f);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.45), 0 12px 26px rgba(0, 0, 0, 0.5);
        }

        .hw-flame {
            position: relative;
            width: 15px;
            height: 32px;
            border-radius: 50% 50% 46% 46%;
            background: radial-gradient(circle at 50% 72%, #fff7cc, #ffb703 44%, #ff6a00 70%, rgba(255, 106, 0, 0) 80%);
            filter: drop-shadow(0 0 14px rgba(255, 150, 40, 0.75));
            transform-origin: 50% 100%;
            animation: hwFlame 1.7s ease-in-out infinite;
        }

        .hw-flame::after {
            content: '';
            position: absolute;
            inset: 34% 28% 12%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff, #ffd166 60%, rgba(255, 209, 102, 0) 100%);
        }

        .hw-candle-halo {
            position: absolute;
            bottom: 40px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 150, 40, 0.34), transparent 65%);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: hwHalo 4.2s ease-in-out infinite;
        }

        @keyframes hwFlame {

            0%,
            100% {
                transform: scale(1) translateY(0) rotate(-1deg);
            }

            25% {
                transform: scale(1.06, 1.12) translateY(-1px) rotate(2deg);
            }

            50% {
                transform: scale(0.96, 1.05) translateY(1px) rotate(-2deg);
            }

            75% {
                transform: scale(1.04, 1.1) translateY(-1px) rotate(1deg);
            }
        }

        @keyframes hwHalo {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.76;
            }
        }

        /* ---------- Encabezado: resplandor y reflejo ---------- */
        .header::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 18% 130%, rgba(255, 90, 20, 0.18), transparent 55%),
                radial-gradient(circle at 88% -30%, rgba(255, 45, 45, 0.16), transparent 55%);
            pointer-events: none;
            z-index: -1;
        }

        .header .titulo {
            position: relative;
            overflow: hidden;
        }

        .header .titulo::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 34%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 195, 130, 0.5), transparent);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: hwTitleShine 7.5s ease-in-out infinite;
        }

        @keyframes hwTitleShine {

            0%,
            60% {
                transform: translateX(-70%) skewX(-18deg);
                opacity: 0;
            }

            68% {
                opacity: 1;
            }

            84%,
            100% {
                transform: translateX(340%) skewX(-18deg);
                opacity: 0;
            }
        }

        .header-btn {
            position: relative;
            overflow: hidden;
        }

        .header-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.28), transparent);
            transform: skewX(-18deg);
            opacity: 0;
            transition: transform 0.6s ease, opacity 0.4s ease;
            pointer-events: none;
        }

        .header-btn:hover::after {
            transform: translateX(320%) skewX(-18deg);
            opacity: 1;
        }

        .header-btn:active {
            transform: scale(0.97);
        }

        .month-nav-btn:active {
            transform: scale(0.92);
        }

        /* ---------- Tarjetas de promociones destacadas ---------- */
        .promotion-card {
            animation: hwCardIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) backwards;
        }

        @keyframes hwCardIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
        }

        .promotion-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(115deg, transparent 22%, rgba(var(--promo-rgb, 255, 255, 255), 0.85) 50%, transparent 78%);
            background-size: 220% 100%;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            opacity: 0.55;
            animation: hwRingFlow 5s linear infinite;
        }

        @keyframes hwRingFlow {
            from {
                background-position: 220% 0;
            }

            to {
                background-position: -220% 0;
            }
        }

        .promotion-card.proximamente::after,
        .promotion-card.unavailable::after {
            display: none;
        }

        .promotion-card.ultimo-dia-promo::after {
            background: linear-gradient(115deg, transparent 18%, rgba(255, 59, 48, 0.95) 42%, rgba(255, 149, 0, 0.95) 58%, transparent 82%);
            background-size: 220% 100%;
            opacity: 0.9;
            animation: hwRingFlow 3.2s linear infinite;
        }

        .promotion-card.ultimo-dia-promo {
            animation: hwCardIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) backwards, hwLastGlow 2.8s ease-in-out infinite;
        }

        @keyframes hwLastGlow {

            0%,
            100% {
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25), 0 0 20px rgba(255, 59, 48, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            }

            50% {
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 34px rgba(255, 149, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
        }

        .promo-shine {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }

        .promo-shine::before {
            content: '';
            position: absolute;
            top: -60%;
            left: 0;
            width: 32%;
            height: 220%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.16), transparent);
            transform: translateX(-180%) rotate(18deg);
            transition: transform 0.8s ease;
        }

        .promotion-card:hover:not(.unavailable):not(.proximamente) .promo-shine::before {
            transform: translateX(380%) rotate(18deg);
        }

        .promotion-icon i {
            animation: hwIconFloat 4.2s ease-in-out infinite;
        }

        @keyframes hwIconFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        /* ---------- Calendario interactivo ---------- */
        .calendar-wrapper {
            animation: hwCalGlow 7.5s ease-in-out infinite;
        }

        @keyframes hwCalGlow {

            0%,
            100% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 45, 45, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            }

            50% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 36px rgba(255, 45, 45, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            }
        }

        .calendar-cell {
            animation: hwCellIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) backwards;
        }

        .calendar-cell.empty {
            animation: none;
        }

        @keyframes hwCellIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }
        }

        .cell-icons span {
            animation: hwIconIn 0.55s ease backwards;
        }

        @keyframes hwIconIn {
            from {
                opacity: 0;
                transform: scale(0.6) translateY(4px);
            }
        }

        .calendar-cell.today .cell-number {
            animation: hwTodayPulse 3.8s ease-in-out infinite;
        }

        @keyframes hwTodayPulse {

            0%,
            100% {
                box-shadow: 0 0 16px rgba(255, 45, 45, 0.5);
            }

            50% {
                box-shadow: 0 0 28px rgba(255, 45, 45, 0.9);
            }
        }

        /* ---------- Ajustes responsive de la ambientación ---------- */
        @media (max-width: 768px) {
            .hw-fog--3 {
                display: none;
            }

            .hw-pumpkin--right {
                display: none;
            }

            .hw-candle--right {
                display: none;
            }

            .hw-spider--2 {
                display: none;
            }

            .hw-web--tr .hw-web-strands {
                opacity: 0.28;
            }

            .hw-web--tr .hw-web-dewdrops {
                opacity: 0.75;
            }

            .hw-pumpkin {
                width: clamp(76px, 20vw, 120px);
            }
        }

        @media (max-width: 480px) {
            .hw-candle--left {
                left: 8vw;
            }

            .hw-glow--red {
                display: none;
            }
        }

        /* =====================================================================
           CALABAZA HALLOWEEN — ELEMENTO DE MARCA EN EL HEADER
           Calabaza tallada hiperrealista (SVG + CSS puro, sin imágenes
           externas): cuerpo lobulado con relieve 3D, rostro tallado
           incandescente, resplandor volumétrico, chispas y humo.
           ===================================================================== */
        .at-pumpkin {
            position: relative;
            flex: 0 0 auto;
            width: clamp(84px, 7.6vw, 120px);
            margin: 0 2px;
            pointer-events: none;
        }

        .at-pumpkin__svg {
            position: relative;
            z-index: 2;
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        /* ---------- Volumen y resplandor del entorno ---------- */
        .at-pumpkin__aura {
            position: absolute;
            left: 50%;
            top: 48%;
            z-index: 0;
            width: 250%;
            height: 240%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(255, 140, 0, 0.32) 0%, rgba(255, 106, 0, 0.15) 34%, rgba(193, 18, 31, 0.07) 58%, transparent 76%);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: atAuraPulse 4.4s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* ---------- Luz proyectada sobre logo y título ---------- */
        .at-pumpkin__cast {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 1;
            width: clamp(240px, 26vw, 380px);
            height: clamp(130px, 14vw, 210px);
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(255, 138, 0, 0.26) 0%, rgba(255, 106, 0, 0.13) 36%, rgba(193, 18, 31, 0.05) 62%, transparent 78%);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: atCastPulse 4.4s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* ---------- Bloom de ojos y boca ---------- */
        .at-pumpkin__bloom {
            position: absolute;
            left: 50%;
            top: 52%;
            z-index: 3;
            width: 195%;
            height: 170%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(255, 160, 30, 0.5) 0%, rgba(255, 106, 0, 0.24) 40%, rgba(193, 18, 31, 0.09) 66%, transparent 80%);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: atBloomFlicker 4.4s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* ---------- Llamas en ojos y boca ---------- */
        .at-pumpkin__flame {
            position: absolute;
            z-index: 4;
            width: 26%;
            height: 30%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 62%, rgba(255, 240, 205, 0.9) 0%, rgba(255, 140, 0, 0.55) 38%, rgba(255, 106, 0, 0.18) 66%, transparent 78%);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: atFlameSway 1.9s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .at-pumpkin__flame--eye-l {
            left: 33%;
            top: 47%;
        }

        .at-pumpkin__flame--eye-r {
            left: 67%;
            top: 47%;
            animation-delay: -0.4s;
        }

        .at-pumpkin__flame--mouth {
            left: 50%;
            top: 66%;
            width: 44%;
            height: 30%;
            animation-delay: -0.9s;
        }

        /* ---------- Humo tenue ---------- */
        .at-pumpkin__smoke {
            position: absolute;
            z-index: 0;
            bottom: 52%;
            width: 42%;
            height: 48%;
            transform: translate(-50%, 0);
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(214, 176, 138, 0.16) 0%, rgba(120, 100, 80, 0.08) 46%, transparent 74%);
            pointer-events: none;
            opacity: 0;
            animation: atSmokeRise 7.4s ease-out infinite;
            will-change: transform, opacity;
        }

        .at-pumpkin__smoke--1 {
            left: 28%;
            --sdx: 12px;
        }

        .at-pumpkin__smoke--2 {
            left: 74%;
            --sdx: -14px;
            animation-delay: -3.4s;
        }

        .at-pumpkin__smoke--3 {
            left: 52%;
            --sdx: 6px;
            animation-delay: -5.7s;
        }

        /* ---------- Chispas naranjas ---------- */
        .at-ember {
            position: absolute;
            z-index: 5;
            bottom: var(--b, 50%);
            left: var(--x, 50%);
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff3c4 0%, #ff8c00 45%, rgba(255, 106, 0, 0) 72%);
            box-shadow: 0 0 6px rgba(255, 140, 0, 0.9);
            pointer-events: none;
            opacity: 0;
            animation: atEmberRise var(--dur, 4.8s) linear infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }

        .at-ember--1 {
            --x: 31%;
            --b: 52%;
            --dx: -8px;
            --dur: 4.4s;
            --delay: 0s;
        }

        .at-ember--2 {
            --x: 36%;
            --b: 50%;
            --dx: 6px;
            --dur: 5.2s;
            --delay: -1.1s;
        }

        .at-ember--3 {
            --x: 64%;
            --b: 52%;
            --dx: 8px;
            --dur: 4.8s;
            --delay: -2.3s;
        }

        .at-ember--4 {
            --x: 69%;
            --b: 50%;
            --dx: -6px;
            --dur: 5.6s;
            --delay: -0.6s;
        }

        .at-ember--5 {
            --x: 44%;
            --b: 33%;
            --dx: 10px;
            --dur: 4.2s;
            --delay: -3.1s;
        }

        .at-ember--6 {
            --x: 58%;
            --b: 31%;
            --dx: -10px;
            --dur: 5s;
            --delay: -1.8s;
        }

        /* ---------- Volumen y profundidad del SVG ---------- */
        .at-pumpkin__body {
            filter: drop-shadow(0 0 8px rgba(255, 106, 0, 0.5)) drop-shadow(0 10px 14px rgba(0, 0, 0, 0.62));
        }

        .at-pumpkin__fire {
            animation: atFireFlicker 4.4s ease-in-out infinite;
        }

        .at-pumpkin__core {
            mix-blend-mode: screen;
        }

        /* ---------- Reflejo cálido sobre logo y título ---------- */
        .header-left--lit .logo-box img {
            filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.34)) drop-shadow(0 0 24px rgba(255, 106, 0, 0.28));
            animation: atLogoBreathe 4.4s ease-in-out infinite;
        }

        .header-left--lit .titulo {
            text-shadow: 0 0 14px rgba(255, 140, 0, 0.3), 0 0 36px rgba(255, 106, 0, 0.18);
        }

        .header-left--lit .total {
            text-shadow: 0 0 18px rgba(255, 45, 45, 0.42), 0 0 32px rgba(255, 140, 0, 0.3);
        }

        /* ---------- Keyframes ---------- */
        @keyframes atAuraPulse {

            0%,
            100% {
                opacity: 0.55;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        @keyframes atCastPulse {

            0%,
            100% {
                opacity: 0.62;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.06);
            }
        }

        @keyframes atBloomFlicker {

            0%,
            100% {
                opacity: 0.72;
                transform: translate(-50%, -50%) scale(1);
            }

            20% {
                opacity: 0.95;
            }

            32% {
                opacity: 0.6;
            }

            44% {
                opacity: 0.9;
            }

            66% {
                opacity: 0.5;
            }

            80% {
                opacity: 0.88;
            }
        }

        @keyframes atFireFlicker {

            0%,
            100% {
                opacity: 1;
            }

            18% {
                opacity: 0.88;
            }

            26% {
                opacity: 1;
            }

            44% {
                opacity: 0.74;
            }

            52% {
                opacity: 0.98;
            }

            74% {
                opacity: 0.82;
            }

            86% {
                opacity: 1;
            }
        }

        @keyframes atFlameSway {

            0%,
            100% {
                opacity: 0.75;
                transform: translate(-50%, -50%) scale(1, 1);
            }

            35% {
                opacity: 1;
                transform: translate(-50%, -52%) scale(1.1, 1.16);
            }

            70% {
                opacity: 0.68;
                transform: translate(-50%, -48%) scale(0.94, 0.9);
            }
        }

        @keyframes atEmberRise {

            0% {
                opacity: 0;
                transform: translate3d(0, 0, 0) scale(0.6);
            }

            12% {
                opacity: 1;
            }

            70% {
                opacity: 0.9;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--dx, 0), -44px, 0) scale(0.2);
            }
        }

        @keyframes atSmokeRise {

            0% {
                opacity: 0;
                transform: translate3d(0, 0, 0) scale(0.5);
            }

            25% {
                opacity: 0.85;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--sdx, 10px), -42px, 0) scale(1.6);
            }
        }

        @keyframes atLogoBreathe {

            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.34)) drop-shadow(0 0 24px rgba(255, 106, 0, 0.26));
            }

            50% {
                filter: drop-shadow(0 0 12px rgba(255, 140, 0, 0.5)) drop-shadow(0 0 34px rgba(255, 106, 0, 0.38));
            }
        }

        /* =====================================================================
           CALABAZA — INTERACCIÓN: OJOS QUE SIGUEN AL CURSOR + DESTELLO
           Las "pupilas" son el núcleo incandescente dentro del tallado: se
           desplazan hacia el puntero dentro de un rango limitado para que el
           gesto se lea natural y no como un ojo de caricatura.
           ===================================================================== */
        .at-pumpkin {
            --eye-x: 0px;
            --eye-y: 0px;
            pointer-events: auto;
        }

        /* ---------- Seguimiento del cursor ---------- */
        .at-pumpkin__iris {
            transform: translate(calc(var(--eye-x) * 0.45), calc(var(--eye-y) * 0.45));
        }

        .at-pumpkin__pupil {
            transform: translate(var(--eye-x), var(--eye-y));
        }

        .at-pumpkin__fire {
            transform: translate(calc(var(--eye-x) * 0.2), calc(var(--eye-y) * 0.2));
        }

        /* ---------- Destello de fuego al pasar el mouse ---------- */
        .at-pumpkin__flare {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 3;
            width: 215%;
            height: 195%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(255, 238, 190, 0.72) 0%, rgba(255, 150, 20, 0.42) 30%, rgba(255, 106, 0, 0.2) 56%, rgba(193, 18, 31, 0.08) 72%, transparent 84%);
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
            will-change: opacity;
        }

        .at-pumpkin__burst {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 3;
            width: 152%;
            height: 152%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 244, 214, 0.85) 0%, rgba(255, 160, 30, 0.48) 22%, rgba(255, 106, 0, 0.16) 48%, transparent 68%);
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0;
        }

        .at-pumpkin__spark {
            position: absolute;
            z-index: 6;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff6d0 0%, #ff8c00 48%, rgba(255, 106, 0, 0) 76%);
            box-shadow: 0 0 9px rgba(255, 150, 30, 0.95);
            pointer-events: none;
            opacity: 0;
        }

        .at-pumpkin__spark--1 {
            left: 30%;
            top: 46%;
            --sx: -16px;
            --sy: -28px;
            --sd: 0s;
        }

        .at-pumpkin__spark--2 {
            left: 35%;
            top: 44%;
            --sx: -10px;
            --sy: -34px;
            --sd: 0.05s;
        }

        .at-pumpkin__spark--3 {
            left: 66%;
            top: 46%;
            --sx: 16px;
            --sy: -30px;
            --sd: 0.1s;
        }

        .at-pumpkin__spark--4 {
            left: 71%;
            top: 45%;
            --sx: 12px;
            --sy: -26px;
            --sd: 0.15s;
        }

        .at-pumpkin__spark--5 {
            left: 47%;
            top: 64%;
            --sx: -6px;
            --sy: -30px;
            --sd: 0.2s;
        }

        .at-pumpkin__spark--6 {
            left: 55%;
            top: 63%;
            --sx: 8px;
            --sy: -32px;
            --sd: 0.25s;
        }

        /* Estado hover: el fuego interior se aviva */
        .at-pumpkin.is-flare .at-pumpkin__flare {
            opacity: 0.72;
        }

        .at-pumpkin.is-flare .at-pumpkin__burst {
            animation: atFlareBurst 0.85s cubic-bezier(0.16, 0.8, 0.3, 1);
        }

        .at-pumpkin.is-flare .at-pumpkin__spark {
            animation: atSparkFly 0.9s ease-out var(--sd, 0s) both;
        }

        .at-pumpkin.is-flare .at-pumpkin__fire {
            filter: brightness(1.28) saturate(1.1);
        }

        .at-pumpkin.is-flare .at-pumpkin__core {
            opacity: 1;
        }

        .at-pumpkin.is-flare .at-pumpkin__flame {
            filter: brightness(1.4) saturate(1.15);
        }

        .at-pumpkin.is-flare .at-pumpkin__bloom {
            filter: brightness(1.18);
        }

        .at-pumpkin.is-flare .at-ember {
            filter: brightness(1.9);
        }

        .at-pumpkin.is-flare .at-pumpkin__svg {
            transform: scale(1.035);
        }

        /* Transiciones solo donde no choca con las animaciones */
        .at-pumpkin__core {
            opacity: 0.88;
            transition: opacity 0.4s ease;
        }

        .at-pumpkin__fire {
            transition: filter 0.4s ease;
        }

        .at-pumpkin__svg {
            transition: transform 0.4s ease;
        }

        .at-pumpkin__flame {
            transition: filter 0.4s ease;
        }

        .at-pumpkin__bloom {
            transition: filter 0.4s ease;
        }

        .at-ember {
            transition: filter 0.4s ease;
        }

        @keyframes atFlareBurst {

            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.78);
            }

            14% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.16);
            }

            38% {
                opacity: 0.62;
                transform: translate(-50%, -50%) scale(1.02);
            }

            70% {
                opacity: 0.32;
                transform: translate(-50%, -50%) scale(0.97);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.94);
            }
        }

        @keyframes atSparkFly {

            0% {
                opacity: 0;
                transform: translate3d(0, 0, 0) scale(0.4);
            }

            14% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--sx, 0px), var(--sy, -24px), 0) scale(0.1);
            }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 1024px) {
            .at-pumpkin {
                width: clamp(76px, 8.6vw, 104px);
            }

            .at-pumpkin__cast {
                width: clamp(220px, 30vw, 320px);
                height: clamp(120px, 17vw, 180px);
            }
        }

        @media (max-width: 768px) {
            .at-pumpkin {
                width: clamp(62px, 11vw, 86px);
            }

            .at-pumpkin__cast {
                width: clamp(190px, 34vw, 280px);
                height: clamp(110px, 20vw, 160px);
            }

            .header-left--lit {
                gap: 10px;
            }
        }

        @media (max-width: 560px) {
            .at-pumpkin {
                width: clamp(52px, 13vw, 70px);
            }

            .at-pumpkin__cast {
                width: clamp(160px, 38vw, 240px);
                height: clamp(96px, 22vw, 140px);
            }
        }

        @media (max-width: 380px) {
            .at-pumpkin {
                width: 48px;
            }
        }

        /* ---------- Movimiento reducido ---------- */
        @media (prefers-reduced-motion: reduce) {
            .halloween-scene {
                animation: none !important;
                opacity: 1;
            }

            .halloween-scene * {
                animation: none !important;
                transition: none !important;
            }

            .hw-canvas,
            .promo-shine {
                display: none !important;
            }

            .calendar-wrapper,
            .calendar-cell,
            .calendar-cell.today .cell-number,
            .cell-icons span,
            .promotion-card,
            .promotion-card::after,
            .promotion-card.ultimo-dia-promo,
            .promotion-icon i,
            .header .titulo::after,
            .header-btn::after,
            .hw-web,
            .hw-dew,
            .hw-dew-sparkle,
            .at-pumpkin__aura,
            .at-pumpkin__cast,
            .at-pumpkin__bloom,
            .at-pumpkin__flame,
            .at-pumpkin__smoke,
            .at-pumpkin__fire,
            .at-pumpkin__burst,
            .at-pumpkin__spark,
            .at-ember,
            .header-left--lit .logo-box img {
                animation: none !important;
            }
        }

                let state = 'activo';
                if (systemDate > effectiveEndDate) {
                    state = 'expirado';
                } else if (systemDate < promo.startDate) {
                    state = 'proximamente';
                }

                promoList.push({ dateStr, promo, state });
            });

            // Ordenar promociones: activas primero, luego próximas
            promoList.sort((a, b) => {
                const stateOrder = { 'activo': 0, 'proximamente': 1, 'expirado': 2 };
                return stateOrder[a.state] - stateOrder[b.state];
            });

            // Renderizar promociones ordenadas - VIGENTES Y PRÓXIMAS
            promoList.forEach(({ dateStr, promo, state }, cardIndex) => {
                // Saltar solo las promociones expiradas
                if (state === 'expirado') {
                    return;
                }

                const card = document.createElement('div');

                card.className = `promotion-card ${promo.category}`;
                if (state === 'proximamente') {
                    card.classList.add('proximamente');
                }
                // Entrada escalonada de las tarjetas
                card.style.animationDelay = `${cardIndex * 0.07}s`;

                let badgeHtml = '';
                let exploreText = '• EXPLORAR';

                // Lógica para el badge de "Último Día"
                const isLastDay = (promo.endDate && systemDate === promo.endDate);
                const isLastCanjeDay = (promo.canjeDate && systemDate === promo.canjeDate);

                if (state === 'proximamente') {
                    badgeHtml = '<div class="promo-badge proximamente">PROXIMAMENTE</div>';
                    card.onclick = null; // No hacer click en promociones próximas
                    exploreText = ''; // Sin texto explorar
                } else if (state === 'activo') {
                    card.onclick = () => showModal(promo);
                    if (promo.customBadgeText) {
                        badgeHtml = `<div class="promo-badge ${promo.customBadgeClass}">${promo.customBadgeText}</div>`;
                    } else {
                        badgeHtml = '<div class="promo-badge activo">ACTIVA</div>';
                    }
                }

                // Prioridad al badge de "Último Día" si la promo está activa
                if (state === 'activo' && isLastDay) {
                    badgeHtml = '<div class="promo-badge ultimo-dia">🔥 ¡ÚLTIMO DÍA!</div>';
                    card.classList.add('ultimo-dia-promo');
                }

                card.innerHTML = `
                    ${badgeHtml}
                    <span class="promo-shine" aria-hidden="true"></span>
                    <div class="promotion-icon">${promo.icon}</div>
                    <div class="promotion-info">
                        <div class="promotion-name">${promo.name}</div>
                        <div class="promotion-explore">${exploreText}</div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Normaliza texto (sin acentos, minúsculas) para comparar contenido de las promos
        function normalizeText(text) {
            return (text || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        // Formato dd/mm/aaaa para las fechas registradas de cada promoción
        function formatShortDate(dateStr) {
            if (!dateStr) return null;
            const [year, month, day] = String(dateStr).split('-');
            if (!year || !month || !day) return null;
            return `${day}/${month}/${year}`;
        }

        // Fecha de canje declarada por la promoción: canjeDate o, en su defecto, announcementDate
        function getPromoCanjeDate(promo) {
            if (!promo) return null;
            return formatShortDate(promo.canjeDate) || formatShortDate(promo.announcementDate);
        }

        // La fecha de canje solo se muestra cuando la promoción la declara expresamente
        // (hasCanje) y además tiene una fecha de canje informada.
        // Nunca se hereda automáticamente del endDate.
        function promoHasCanje(promo) {
            if (!promo || promo.hasCanje !== true) return false;
            return Boolean(getPromoCanjeDate(promo));
        }

        // Frases que describen el período de participación (se muestran en el bloque VIGENCIA)
        const VIGENCIA_PARTICIPACION = /(particip|vigencia|cumplimiento de misiones|misiones|realizacion de (apuestas|jugadas)|(apuestas|tickets|jugadas) (realizadas|calculadas|calculados|ganados|ganadas)|del .+ al |desde .+ hasta |mismo dia)/i;

        // Frases que describen el canje o premio (se muestran en el bloque CANJE)
        const VIGENCIA_CANJE = /(canje|canjear|reclam|cobr|anuncio|activar y usar|ganador)/i;

        // Recupera las condiciones del bloque "Vigencia" original que no se
        // pueden deducir de las fechas registradas (stock, acceso, canales, etc.)
        function extractVigenciaExtras(promo) {
            const extras = { condiciones: [], canje: [] };
            if (!promo.htmlDetails) return extras;

            const container = document.createElement('div');
            container.innerHTML = promo.htmlDetails;

            container.querySelectorAll('.promo-section').forEach((section) => {
                const title = section.querySelector('.promo-section-title');
                const content = section.querySelector('.promo-section-content');
                if (!title || !content) return;
                if (!/vigencia/i.test(normalizeText(title.textContent))) return;

                content.innerHTML.split(/<br\s*\/?>/i).forEach((block) => {
                    const plain = normalizeText(block.replace(/<[^>]*>/g, ' '));
                    if (!plain) return;
                    if (VIGENCIA_PARTICIPACION.test(plain)) return;
                    if (VIGENCIA_CANJE.test(plain)) {
                        extras.canje.push(block.trim());
                        return;
                    }
                    extras.condiciones.push(block.trim());
                });
            });

            return extras;
        }

        // Bloque "Vigencia": muestra únicamente el período de participación de la promoción
        function buildPromoVigenciaSection(promo) {
            const start = formatShortDate(promo.startDate);
            const end = formatShortDate(promo.endDate);

            const vigenciaText = (start && end)
                ? `Promoción válida desde el <strong>${start}</strong> hasta el <strong>${end}</strong>.`
                : 'Promoción sin fechas de vigencia definidas.';

            return `
                <div class="promo-section" data-generated="vigencia">
                    <div class="promo-section-title"><i class="fa-solid fa-calendar-check outline-icon"></i> Vigencia</div>
                    <div class="promo-section-content">
                        ${vigenciaText}<br><br>
                        ⏳ <strong>Fin Promoción (${end || '—'})</strong>: último día en que el cliente puede participar en la promoción.
                    </div>
                </div>
            `;
        }

        // Bloque "Canje": solo se genera si la promoción tiene una fecha de canje
        // expresamente configurada (independiente de la vigencia)
        function buildPromoCanjeSection(promo, extras) {
            if (!promoHasCanje(promo)) return '';
            const canje = getPromoCanjeDate(promo);

            const extraHtml = (extras && extras.canje.length)
                ? `<br><br>ℹ️ <strong>Condiciones del canje:</strong><br>${extras.canje.map((extra) => `• ${extra}`).join('<br>')}`
                : '';

            return `
                <div class="promo-section" data-generated="canje">
                    <div class="promo-section-title"><i class="fa-solid fa-ticket outline-icon"></i> Canje</div>
                    <div class="promo-section-content">
                        Premio canjeable hasta el <strong>${canje}</strong>.<br><br>
                        🎁 <strong>Fecha de Canje (${canje})</strong>: último día para reclamar o utilizar el beneficio obtenido.
                        ${extraHtml}
                    </div>
                </div>
            `;
        }

        // Bloque "Condiciones": condiciones del beneficio que no se deducen de las fechas
        function buildPromoConditionsSection(promo, extras) {
            if (!extras || !extras.condiciones.length) return '';

            return `
                <div class="promo-section" data-generated="condiciones">
                    <div class="promo-section-title"><i class="fa-solid fa-circle-info outline-icon"></i> Condiciones</div>
                    <div class="promo-section-content">
                        ${extras.condiciones.map((extra) => `• ${extra}`).join('<br>')}
                    </div>
                </div>
            `;
        }

        // Construye el detalle de la promoción: el bloque manual de "Vigencia" se reemplaza
        // por los bloques automáticos generados desde el registro de la promoción
        function buildPromoDetails(promo) {
            const fallback = `
                <div class="promo-section">
                    <div class="promo-section-title"><i class="fa-solid fa-trophy outline-icon"></i> Descripción</div>
                    <div class="promo-section-content">${promo.description || ''}</div>
                </div>
                <div class="promo-section highlight">
                    <div class="promo-section-title"><i class="fa-solid fa-location-dot outline-icon"></i> Condiciones</div>
                    <div class="promo-section-content">Promoción sujeta a términos y condiciones generales de Apuesta Total.</div>
                </div>
            `;

            const container = document.createElement('div');
            container.innerHTML = promo.htmlDetails || fallback;

            const manualVigencia = Array.from(container.querySelectorAll('.promo-section')).filter((section) => {
                const title = section.querySelector('.promo-section-title');
                return title && /vigencia/i.test(normalizeText(title.textContent));
            });

            const extras = extractVigenciaExtras(promo);

            const generated = document.createElement('div');
            generated.innerHTML = buildPromoVigenciaSection(promo)
                + buildPromoCanjeSection(promo, extras)
                + buildPromoConditionsSection(promo, extras);
            const generatedNodes = Array.from(generated.children);

            if (manualVigencia.length) {
                const anchor = manualVigencia[0];
                generatedNodes.forEach((node) => anchor.parentNode.insertBefore(node, anchor));
                manualVigencia.forEach((section) => section.remove());
            } else {
                generatedNodes.slice().reverse().forEach((node) => container.insertBefore(node, container.firstChild));
            }

            return container.innerHTML;
        }

        function buildPromoKpis(promo) {
            const statusLabel = promo.available === false ? 'No disponible' : 'Activa';
            const startLabel = formatShortDate(promo.startDate) || 'Sin fecha';
            const endLabel = formatShortDate(promo.endDate) || 'Sin fecha límite';
            const hasCanje = promoHasCanje(promo);

            // La fecha de canje solo se muestra cuando existe en la configuración de la promoción
            const canjeKpi = hasCanje
                ? `<div class="modal-kpi" title="Fecha específica hasta la cual el cliente puede reclamar o utilizar el beneficio obtenido"><span class="modal-kpi-label">Fecha de Canje</span><strong class="modal-kpi-value">${getPromoCanjeDate(promo)}</strong></div>`
                : '';

            return `
                <div class="modal-kpis${hasCanje ? '' : ' modal-kpis--compact'}" aria-label="Resumen de promoción">
                    <div class="modal-kpi" title="Estado actual de la promoción"><span class="modal-kpi-label">Estado</span><strong class="modal-kpi-value">${statusLabel}</strong></div>
                    <div class="modal-kpi" title="Fecha de inicio de la promoción"><span class="modal-kpi-label">Inicio</span><strong class="modal-kpi-value">${startLabel}</strong></div>
                    <div class="modal-kpi" title="Último día en que el cliente puede participar en la promoción"><span class="modal-kpi-label">Fin Promoción</span><strong class="modal-kpi-value">${endLabel}</strong></div>
                    ${canjeKpi}
                </div>
            `;
        }

        function markFullWidthSections(root) {
            if (!root) return;
            root.querySelectorAll('.promo-section').forEach((section) => {
                const title = section.querySelector('.promo-section-title');
                if (!title) return;
                const text = title.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
                section.classList.toggle('full-width', text.includes('MECANICA'));
            });
        }

        function showModal(data, dateStr = null) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            const iconWrapper = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalInfo = document.getElementById('modalInfo');

            // Limpiar colores anteriores del modal
            modalContent.classList.remove('green', 'yellow', 'purple', 'blue', 'red', 'multi');

            modalInfo.innerHTML = '';

            if (Array.isArray(data)) {
                // Mostrar múltiples promociones con navegación master-detail
                modalTitle.textContent = `Promociones del ${formatDate(dateStr)}`;
                if (iconWrapper) iconWrapper.innerHTML = '<i class="fa-solid fa-layer-group" style="font-size: 24px; color: #fff;"></i>';
                modalContent.classList.add('multi');

                const categoryColors = {
                    green: '#00ff66',
                    yellow: '#ff9900',
                    purple: '#9d4edd',
                    blue: '#00d9ff',
                    red: '#ff0066',
                    orange: '#ff9900',
                    magenta: '#ff1493'
                };

                modalInfo.innerHTML = `
                    <div class="master-detail">
                        <aside class="master-list-panel">
                            <div class="master-list-heading">${data.length} promociones del día</div>
                            <div class="master-list" id="masterPromoList"></div>
                        </aside>
                        <section class="master-detail-panel" id="masterPromoDetail" aria-live="polite"></section>
                    </div>
                `;

                const promoList = document.getElementById('masterPromoList');
                const promoDetail = document.getElementById('masterPromoDetail');

                const renderSelectedPromo = (promo, index) => {
                    const promoColor = categoryColors[promo.category] || '#00ff88';
                    modalContent.classList.remove('green', 'yellow', 'purple', 'blue', 'red', 'orange', 'magenta');
                    modalContent.classList.add(promo.category || 'green');

                    const details = buildPromoDetails(promo);
                    const limaTag = promo.customBadgeClass === 'lima-only'
                        ? '<span class="lima-tag">📍 Solo Lima</span>'
                        : '';

                    promoDetail.innerHTML = `
                        <div class="master-detail-heading" style="--master-color: ${promoColor};">
                            <span class="master-promo-status">Promoción ${index + 1} de ${data.length}</span>
                            ${limaTag}
                            <h3 style="color: ${promoColor}; font-family: 'Montserrat', sans-serif; font-size: clamp(18px, 2vw, 25px); line-height: 1.2; margin: 0 0 18px; text-shadow: 0 0 14px ${promoColor}40;">${promo.name}</h3>
                        </div>
                        ${buildPromoKpis(promo)}
                        <div class="master-detail-sections">${details}</div>
                    `;

                    markFullWidthSections(promoDetail);

                    promoList.querySelectorAll('.master-promo-option').forEach((option, optionIndex) => {
                        option.classList.toggle('active', optionIndex === index);
                    });
                };

                data.forEach((promo, index) => {
                    const promoColor = categoryColors[promo.category] || '#00ff88';
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.className = 'master-promo-option';
                    option.style.setProperty('--master-color', promoColor);
                    option.innerHTML = `
                        <span class="master-promo-status">Activa</span>
                        ${promo.customBadgeClass === 'lima-only' ? '<span class="lima-tag">📍 Solo Lima</span>' : ''}
                        <span class="master-promo-name">${promo.name}</span>
                        <span class="master-promo-index">Ver detalle completo</span>
                    `;
                    option.addEventListener('click', () => renderSelectedPromo(promo, index));
                    promoList.appendChild(option);
                });

                renderSelectedPromo(data[0], 0);
            } else {
                // Mostrar una sola promoción (click directo en la tarjeta o en el ícono)
                const promo = data;
                modalTitle.textContent = promo.name;
                if (iconWrapper) iconWrapper.innerHTML = promo.icon;

                // Asignar dinámicamente el color según la promoción que eligió
                modalContent.classList.add(promo.category);

                // Distintivo de promociones exclusivas de Lima
                const limaTag = promo.customBadgeClass === 'lima-only'
                    ? '<div style="grid-column: 1 / -1; margin-bottom: 2px;"><span class="lima-tag">📍 Solo Lima</span></div>'
                    : '';

                modalInfo.innerHTML = buildPromoKpis(promo) + limaTag + buildPromoDetails(promo);

                markFullWidthSections(modalInfo);
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const [year, month, day] = dateStr.split('-');
            const date = new Date(year, month - 1, day);
            return date.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function previousMonth() {
            if (currentMonth === 0) {
                currentMonth = 11;
                currentYear--;
            } else {
                currentMonth--;
            }
            updateDisplay();
        }

        function nextMonth() {
            if (currentMonth === 11) {
                currentMonth = 0;
                currentYear++;
            } else {
                currentMonth++;
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('monthName').textContent = monthNames[currentMonth].toUpperCase();
            document.getElementById('yearName').textContent = currentYear;
            renderCalendar();
            renderPromotions();
        }

        // ==================== LÓGICA DE GRILLA PREMIUM ==================== 
        let countdownInterval;

        function toggleGrillaView(show) {
            const homeView = document.getElementById('homeView');
            const grillaView = document.getElementById('grillaView');

            if (show) {
                homeView.style.display = 'none';
                grillaView.style.display = 'block';

                renderGrilla();
                startCountdown();
            } else {
                homeView.style.display = 'block';
                grillaView.style.display = 'none';
                if (countdownInterval) clearInterval(countdownInterval);
            }
        }

        function renderGrilla() {
            const grid = document.getElementById('grillaGrid');
            const searchTerm = document.getElementById('grillaSearch').value.toLowerCase();
            const filterDate = document.getElementById('grillaDate').value;

            grid.innerHTML = '';
            const now = new Date(); // Usando hora real del sistema
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;

            let filtered = grillaEvents.filter(ev => {
                const [year, month, day] = ev.date.split('-');
                const [hours, mins] = ev.time.split(':');
                const eventDate = new Date(year, month - 1, day, hours, mins);

                // Oculta eventos que finalizaron hace más de 4 horas
                const eventEnd = new Date(eventDate.getTime() + (4 * 60 * 60 * 1000));
                if (eventEnd < now) return false;

                if (searchTerm && !ev.t1.toLowerCase().includes(searchTerm) && !ev.t2.toLowerCase().includes(searchTerm)) return false;
                if (filterDate && ev.date !== filterDate) return false;
                return true;
            });

            filtered.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: #888; font-size: 16px;">No hay eventos deportivos disponibles o todos han finalizado.</div>';
                return;
            }

            filtered.forEach((ev, index) => {
                let badgeHtml = ev.date === todayStr ? '<span class="grilla-badge badge-hoy">HOY</span>' :
                    (ev.date === tomorrowStr ? '<span class="grilla-badge badge-manana">MAÑANA</span>' :
                        '<span class="grilla-badge badge-proximo">PRÓXIMO</span>');

                let glowClass = ev.importance === 'high' ? 'glow-red' : (ev.importance === 'medium' ? 'glow-yellow' : 'glow-blue');
                let iconLabel = ev.importance === 'high' ? '<i class="fa-solid fa-bolt outline-icon"></i> EVENTO DESTACADO' : (ev.importance === 'medium' ? '<i class="fa-solid fa-bullseye outline-icon"></i> EVENTO CLAVE' : '<i class="fa-solid fa-star outline-icon"></i> PARTIDO OFICIAL');
                let iconColor = ev.importance === 'high' ? '#FF0066' : (ev.importance === 'medium' ? '#FFD700' : '#00D9FF');

                const displayDate = new Date(ev.date + "T00:00:00").toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit' }).replace(/^\w/, c => c.toUpperCase());

                grid.innerHTML += `
                    <div class="grilla-card ${glowClass}" style="animation-delay: ${index * 0.1}s">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;">
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <div class="grilla-header-title" style="color: ${iconColor};">${iconLabel}</div>
                                <div class="grilla-badge-container">${badgeHtml}</div>
                            </div>
                            <div class="grilla-countdown" data-target="${ev.date}T${ev.time}">Cargando...</div>
                        </div>
                        
                        <div class="grilla-datetime">
                            <span><i class="fa-solid fa-calendar-day"></i> ${displayDate}</span>
                            <span><i class="fa-solid fa-clock"></i> ${ev.time}</span>
                        </div>

                        <div class="grilla-teams">
                            <div class="grilla-team">${ev.f1 ? `<img src="https://flagcdn.com/w80/${ev.f1}.png" class="grilla-flag" alt="">` : ''}<span class="grilla-team-name">${ev.t1}</span></div>
                            <div class="grilla-vs">VS</div>
                            <div class="grilla-team">${ev.f2 ? `<img src="https://flagcdn.com/w80/${ev.f2}.png" class="grilla-flag" alt="">` : ''}<span class="grilla-team-name">${ev.t2}</span></div>
                        </div>

                        <div>
                            <div class="grilla-section-title"><i class="fa-solid fa-tv outline-icon"></i> Transmisión:</div>
                            <div class="grilla-tv">${ev.tv.map(c => `<span>${c}</span>`).join('')}</div>
                        </div>

                        <div>
                            <div class="grilla-section-title"><i class="fa-solid fa-book-open outline-icon"></i> DATO AT</div>
                            <ul class="grilla-list">${ev.datos.map(d => `<li><i class="fa-solid fa-caret-right"></i> ${d}</li>`).join('')}</ul>
                        </div>

                        <div>
                            <div class="grilla-section-title"><i class="fa-solid fa-bullseye outline-icon"></i> Mercados a incentivar</div>
                            <ul class="grilla-list">${ev.mercados.map(m => `<li><i class="fa-solid fa-bolt"></i> ${m}</li>`).join('')}</ul>
                        </div>
                    </div>
                `;
            });
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                document.querySelectorAll('.grilla-countdown').forEach(el => {
                    const target = new Date(el.dataset.target).getTime();
                    const distance = target - now;
                    if (distance < 0) {
                        if (distance < -7200000) { // Si pasaron 2 horas, está finalizado
                            el.innerHTML = "FINALIZADO";
                            el.style.color = "#1ED760";
                            el.style.borderColor = "rgba(30, 215, 96, 0.4)";
                        } else {
                            el.innerHTML = "¡EN VIVO!";
                            el.style.color = "#FF0066";
                            el.style.borderColor = "rgba(255, 0, 102, 0.4)";
                        }
                    } else {
                        const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((distance % (1000 * 60)) / 1000);
                        el.innerHTML = `⏳ ${d}d ${h}h ${m}m ${s}s`;
                    }
                });
            }, 1000);
        }

        // ==================== INICIALIZACIÓN ==================== 
        window.addEventListener('load', () => {
            updateDisplay();
        });

        // ==================== CALABAZA: OJOS + DESTELLO ====================
        // El tallado no tiene párpados: lo que "mira" es el núcleo incandescente
        // dentro de cada ojo. Se desplaza hacia el puntero con un rango muy
        // corto para que se lea como una llama que se inclina, no como un ojo
        // de caricatura. Al posar el mouse sobre la calabaza, el fuego interno
        // se aviva y escupe chispas.
        (function pumpkinInteraction() {
            const root = document.querySelector('.at-pumpkin');
            if (!root) return;

            const VIEW_W = 160;                  // ancho del viewBox del SVG
            const FACE_X = 80;                   // centro de los ojos (unidades SVG)
            const FACE_Y = 72;
            const REACH = 30;                    // radio máximo de "mirada"
            const calm = window.matchMedia('(prefers-reduced-motion: reduce)');
            const PUPIL_MAX = calm.matches ? 0.9 : 2.6;   // recorrido del núcleo
            const EASE = 0.12;                   // suavizado por fotograma

            let pointerX = 0;
            let pointerY = 0;
            let targetX = 0;
            let targetY = 0;
            let currentX = 0;
            let currentY = 0;
            let raf = null;

            const write = () => {
                root.style.setProperty('--eye-x', (currentX * PUPIL_MAX).toFixed(3) + 'px');
                root.style.setProperty('--eye-y', (currentY * PUPIL_MAX).toFixed(3) + 'px');
            };

            const frame = () => {
                const rect = root.getBoundingClientRect();
                if (rect.width) {
                    const scale = rect.width / VIEW_W;
                    const px = (pointerX - rect.left) / scale;
                    const py = (pointerY - rect.top) / scale;
                    const dx = px - FACE_X;
                    const dy = py - FACE_Y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const reach = Math.min(dist, REACH) / REACH;
                    targetX = (dx / dist) * reach;
                    targetY = (dy / dist) * reach;
                }

                currentX += (targetX - currentX) * EASE;
                currentY += (targetY - currentY) * EASE;
                write();

                const settled = Math.abs(targetX - currentX) < 0.002 && Math.abs(targetY - currentY) < 0.002;
                if (settled) {
                    currentX = targetX;
                    currentY = targetY;
                    write();
                    raf = null;
                } else {
                    raf = requestAnimationFrame(frame);
                }
            };

            const schedule = () => {
                if (raf === null) raf = requestAnimationFrame(frame);
            };

            const onPointerMove = (e) => {
                pointerX = e.clientX;
                pointerY = e.clientY;
                schedule();
            };

            const onEnter = () => root.classList.add('is-flare');
            const onLeave = () => {
                root.classList.remove('is-flare');
                targetX = 0;
                targetY = 0;
                schedule();
            };
            const onWindowLeave = () => {
                targetX = 0;
                targetY = 0;
                schedule();
            };

            root.addEventListener('pointerenter', onEnter);
            root.addEventListener('pointerleave', onLeave);
            window.addEventListener('pointermove', onPointerMove, { passive: true });
            document.addEventListener('pointerleave', onWindowLeave);
            window.addEventListener('blur', onWindowLeave);

            write();
        })();

                if (!batsLayer) return;
