<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APUESTA TOTAL - Dashboard Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0a0a0a;
            background-image: linear-gradient(135deg, rgba(29, 185, 84, 0.02) 0%, transparent 100%);
            background-attachment: fixed;
            background-position: center, center;
            background-repeat: repeat, no-repeat;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Scrollbar minimalista Spotify */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* ==================== HEADER ==================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-box {
            width: 140px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .titulo {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            margin: 0;
        }

        .apuesta {
            color: #e6e6e6;
        }

        .total {
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255, 59, 48, 0.4);
        }

        .subtitulo {
            color: #9e9e9e;
            font-size: 16px;
            margin-top: 8px;
            letter-spacing: 1px;
            font-style: italic;
            animation: pulseTextGlow 2s infinite ease-in-out;
        }

        @keyframes pulseTextGlow {

            0%,
            100% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
                color: #9e9e9e;
            }

            50% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 25px rgba(255, 255, 255, 0.5);
                color: #ffffff;
            }
        }

        .emojis-neon {
            color: #e0aaff;
            font-size: 20px;
            margin-top: 6px;
            letter-spacing: 6px;
            text-align: left;
            animation: pulseNeonPurple 2s infinite ease-in-out;
        }

        @keyframes pulseNeonPurple {

            0%,
            100% {
                text-shadow: 0 0 5px #e0aaff, 0 0 10px #c77dff;
                opacity: 0.8;
            }

            50% {
                text-shadow: 0 0 10px #e0aaff, 0 0 20px #c77dff, 0 0 30px #9d4edd, 0 0 40px #7b2cbf;
                opacity: 1;
            }
        }

        /* ==================== EFECTO CORAZONES ==================== */
        .heart-particle {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            animation: floatUpHeart 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 9999;
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.8);
        }

        @keyframes floatUpHeart {
            0% {
                transform: translateY(0) scale(0.5) rotate(-10deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-80px) scale(1.5) rotate(20deg);
                opacity: 0;
            }
        }

        .header-right {
            display: flex;
            gap: 16px;
        }

        .header-btn {
            padding: 12px 24px;
            border-radius: 500px;
            background: #111111;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .header-btn.lilac {
            border: 1px solid rgba(167, 139, 250, 0.55);
            color: #A78BFA;
            box-shadow: 0 0 8px rgba(167, 139, 250, 0.12), inset 0 0 5px rgba(167, 139, 250, 0.06);
            transition: all 0.28s ease;
        }

        .header-btn.lilac:hover {
            transform: scale(1.02);
            color: #C4B5FD;
            border-color: rgba(196, 181, 253, 0.75);
            box-shadow: 0 0 14px rgba(196, 181, 253, 0.22), inset 0 0 8px rgba(196, 181, 253, 0.1);
            background: rgba(167, 139, 250, 0.08);
        }

        .header-btn.green {
            border: 1px solid rgba(0, 255, 157, 0.42);
            color: rgba(0, 255, 157, 0.82);
            box-shadow: 0 0 8px rgba(0, 255, 157, 0.08), inset 0 0 5px rgba(0, 255, 157, 0.04);
            transition: all 0.28s ease;
        }

        .header-btn.green:hover {
            transform: scale(1.02);
            color: #00FF9D;
            border-color: rgba(0, 255, 157, 0.6);
            box-shadow: 0 0 14px rgba(0, 255, 157, 0.22), inset 0 0 8px rgba(0, 255, 157, 0.1);
            background: rgba(0, 255, 157, 0.06);
        }

        /* ==================== BOTONES SEÑALÉTICOS (DATO AT - GRILLA / VOLVER) ====================
           Sin parpadeo ni animaciones pulsantes: glow corto, sutil y elegante. */

        #btn-dato-grilla {
            border-width: 2px;
        }

        #btn-dato-grilla i.fa-arrow-right {
            font-size: 18px;
            /* Flecha grande y visible */
            margin-left: 6px;
        }

        #btn-volver-grilla {
            border-width: 2px;
            font-weight: 900;
        }

        #btn-volver-grilla i.fa-arrow-left {
            font-size: 18px;
            /* Flecha grande y visible */
            margin-right: 4px;
        }

        /* ==================== CONTAINER ==================== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        /* ==================== NAVEGACIÓN MESES ==================== */
        .month-navigation {
            text-align: left;
            margin-bottom: 30px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 16px;
        }

        .month-nav-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .month-nav-btn:hover {
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255, 59, 48, 0.6);
        }

        .month-display {
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .month-display .month-name {
            color: #e6e6e6;
        }

        .month-display .month-year {
            color: #ff3b30;
        }

        /* ==================== ANIMACIÓN COPA DEL MUNDO ==================== */
        /* ==================== PROMOCIONES - SPORTSBOOK PREMIUM ==================== */
        .promotions-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            font-style: normal;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .promotions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .promotion-card {
            background: linear-gradient(135deg, rgba(22, 22, 26, 0.92), rgba(35, 35, 40, 0.86));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.14);
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 10px 24px rgba(0, 0, 0, 0.38);
            overflow: visible;
            isolation: isolate;
        }

        .promotion-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 35%, transparent 70%, rgba(255, 255, 255, 0.04));
            pointer-events: none;
            z-index: 0;
        }

        .promotion-card:hover:not(.unavailable):not(.proximamente) {
            transform: translateY(-4px);
            background: linear-gradient(135deg, rgba(35, 35, 40, 0.96), rgba(45, 45, 52, 0.88));
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 18px 38px rgba(0, 0, 0, 0.54);
        }

        .promotion-card.green {
            border: 1.5px solid rgba(29, 185, 84, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(29, 185, 84, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(29, 185, 84, 0.16);
        }

        .promotion-card.green:hover:not(.unavailable) {
            border-color: rgba(29, 185, 84, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(29, 185, 84, 0.3), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(29, 185, 84, 0.26);
        }

        .promotion-card.green .outline-icon {
            -webkit-text-stroke-color: #1DB954;
        }

        .promotion-card.yellow {
            border: 1.5px solid rgba(255, 196, 0, 0.75);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(255, 196, 0, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(255, 196, 0, 0.15);
        }

        .promotion-card.yellow:hover:not(.unavailable) {
            border-color: rgba(255, 196, 0, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(255, 196, 0, 0.28), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(255, 196, 0, 0.22);
        }

        .promotion-card.yellow .outline-icon {
            -webkit-text-stroke-color: #ffd700;
        }

        .promotion-card.purple {
            border: 1.5px solid rgba(180, 142, 239, 0.75);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(180, 142, 239, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(180, 142, 239, 0.18);
        }

        .promotion-card.purple:hover:not(.unavailable) {
            border-color: rgba(180, 142, 239, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(180, 142, 239, 0.28), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(180, 142, 239, 0.26);
        }

        .promotion-card.purple .outline-icon {
            -webkit-text-stroke-color: #b48eef;
        }

        .promotion-card.blue {
            border: 1.5px solid rgba(0, 217, 255, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(0, 217, 255, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(0, 217, 255, 0.14);
        }

        .promotion-card.blue:hover:not(.unavailable) {
            border-color: rgba(0, 217, 255, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(0, 217, 255, 0.28), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(0, 217, 255, 0.22);
        }

        .promotion-card.blue .outline-icon {
            -webkit-text-stroke-color: #00d9ff;
        }

        .promotion-card.red {
            border: 1.5px solid rgba(255, 61, 92, 0.75);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(255, 61, 92, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(255, 61, 92, 0.16);
        }

        .promotion-card.red:hover:not(.unavailable) {
            border-color: rgba(255, 61, 92, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(255, 61, 92, 0.28), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(255, 61, 92, 0.24);
        }

        .promotion-card.red .outline-icon {
            -webkit-text-stroke-color: #ff0066;
        }

        .promotion-card.orange {
            border: 1.5px solid rgba(255, 149, 0, 0.78);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(255, 149, 0, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(255, 149, 0, 0.16);
        }

        .promotion-card.orange:hover:not(.unavailable) {
            border-color: rgba(255, 149, 0, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(255, 149, 0, 0.28), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(255, 149, 0, 0.22);
        }

        .promotion-card.orange .outline-icon {
            -webkit-text-stroke-color: #ff9500;
        }

        .promotion-card.magenta {
            border: 1.5px solid rgba(255, 20, 147, 0.72);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(255, 20, 147, 0.18), 0 12px 30px rgba(0, 0, 0, 0.38), 0 0 18px rgba(255, 20, 147, 0.16);
        }

        .promotion-card.magenta:hover:not(.unavailable) {
            border-color: rgba(255, 20, 147, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(255, 20, 147, 0.28), 0 18px 42px rgba(0, 0, 0, 0.52), 0 0 24px rgba(255, 20, 147, 0.24);
        }

        .promotion-card.magenta .outline-icon {
            -webkit-text-stroke-color: #ff1493;
        }

        .promotion-card.unavailable {
            border-color: rgba(100, 100, 100, 0.1);
            box-shadow: none;
            opacity: 0.4;
            cursor: default;
            filter: grayscale(100%);
        }

        .promotion-card.unavailable .promotion-name {
            color: #666666;
        }

        .promotion-card.proximamente {
            border-color: rgba(100, 100, 100, 0.15);
            opacity: 0.5;
            filter: grayscale(80%);
            cursor: default;
        }

        .promotion-card.proximamente:hover:not(.unavailable) {
            transform: none;
            filter: grayscale(80%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.5), rgba(40, 40, 40, 0.3));
        }

        .promotion-card.proximamente .promotion-name {
            color: #888888;
        }

        /* ==================== BADGES PROMOCIONES PREMIUM ==================== */
        @keyframes badgePulse {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                box-shadow: 0 0 0 rgba(255, 255, 255, 0), 0 0 10px rgba(255, 255, 255, 0.12);
            }

            50% {
                transform: translateY(-1px) scale(1.02);
                opacity: 0.96;
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.22), 0 0 28px currentColor;
            }
        }

        .promo-badge {
            position: absolute;
            top: -10px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.22);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            animation: badgePulse 1.8s ease-in-out infinite;
        }

        .promo-badge.expirado {
            background: rgba(50, 50, 50, 0.8);
            color: #888888;
            border: 1px solid rgba(100, 100, 100, 0.3);
        }

        .promo-badge.canje {
            background: linear-gradient(135deg, #ff9900, #ff7700);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 153, 0, 0.68);
        }

        .promo-badge.lima-only {
            background: linear-gradient(135deg, #ff0066, #ff3366);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 0, 102, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .promo-badge.activo {
            background: linear-gradient(135deg, #1DB954, #1ed760);
            color: #000000;
            box-shadow: 0 0 22px rgba(29, 185, 84, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .promo-badge.ultimo-dia {
            background: linear-gradient(45deg, #ff3b30, #ff9500);
            color: #fff;
            box-shadow: 0 0 24px rgba(255, 59, 48, 0.82), 0 0 30px rgba(255, 149, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .promo-badge.proximamente {
            background: rgba(100, 100, 100, 0.7);
            color: #d0d0d0;
            box-shadow: none;
            border: none;
            animation: none;
        }

        /* ==================== BADGES ESPECIALES ==================== */
        /* Las promociones exclusivas de Lima se identifican con la píldora "SOLO LIMA"
           en la esquina superior derecha de la tarjeta (badgePulse) */

        @keyframes pulse-hot {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(255, 59, 48, 0.7), 0 0 25px rgba(255, 149, 0, 0.5);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 25px rgba(255, 59, 48, 1), 0 0 40px rgba(255, 149, 0, 0.8);
            }
        }

        .promo-badge.proximo {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.8), 0 0 30px rgba(118, 75, 162, 0.6);
            border: 2px solid #fff;
            font-weight: 900;
            animation: pulse-proximo 1.3s infinite ease-in-out;
        }

        @keyframes pulse-proximo {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.8), 0 0 30px rgba(118, 75, 162, 0.6);
            }

            50% {
                transform: scale(1.08);
                box-shadow: 0 0 30px rgba(102, 126, 234, 1), 0 0 50px rgba(118, 75, 162, 0.9);
            }
        }

        /* ==================== ICONOS OUTLINE (PREMIUM) ==================== */
        .outline-icon {
            color: transparent !important;
            -webkit-text-stroke: 1.5px #FFFFFF;
            font-size: 16px;
            text-shadow: none !important;
            background: transparent !important;
            box-shadow: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .promotion-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .promotion-card:hover:not(.unavailable) .promotion-icon {
            transform: scale(1.1);
        }

        .promotion-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .promotion-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            font-style: normal;
            color: #ffffff;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .promotion-explore {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 500;
            font-style: normal;
            color: #b3b3b3;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            margin-top: 4px;
        }

        .promotion-card:hover:not(.unavailable):not(.proximamente) .promotion-explore {
            color: #ffffff;
        }

        /* ==================== CALENDARIO ==================== */
        /* ==================== CALENDARIO SPOTIFY PREMIUM + SPORTSBOOK ==================== */
        .calendar-wrapper {
            background: linear-gradient(135deg, rgba(15, 15, 15, 0.8) 0%, rgba(18, 18, 18, 0.8) 50%, rgba(10, 10, 10, 0.9) 100%);
            border-radius: 12px;
            padding: 40px 32px;
            position: relative;
            border: 1px solid rgba(29, 185, 84, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .calendar-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(100, 100, 100, 0.08) 1px, transparent 1px) 0 0 / 100% 100%,
                linear-gradient(rgba(100, 100, 100, 0.08) 1px, transparent 1px) 0 0 / 100% 100%;
            pointer-events: none;
            border-radius: 12px;
            background-size: 14.28% 100%, 100% 14.28%;
            z-index: 0;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            margin-bottom: 24px;
            padding: 0;
            border-bottom: 2px solid rgba(29, 185, 84, 0.2);
            position: relative;
            z-index: 1;
        }

        .calendar-header::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 100, 100, 0.3), transparent);
        }

        .calendar-day-name {
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            color: #ffffff;
            padding: 16px 8px;
            border-bottom: 1px solid transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
            border-right: 1px solid rgba(100, 100, 100, 0.1);
        }

        .calendar-day-name:nth-child(7n) {
            border-right: none;
        }

        .calendar-day-name:hover {
            color: #1DB954;
            text-shadow: 0 0 12px rgba(29, 185, 84, 0.3);
        }

        .calendar-days {

        /* Línea de celda del calendario */
        .calendar-cell {
            aspect-ratio: 1;
            background: rgba(30, 30, 30, 0.4);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            min-height: 100px;
            padding-top: 12px;
            border: 1px solid rgba(100, 100, 100, 0.15);
            border-right: 1px solid rgba(100, 100, 100, 0.1);
            border-bottom: 1px solid rgba(100, 100, 100, 0.1);
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell:hover:not(.empty) {
            background: linear-gradient(135deg, rgba(29, 185, 84, 0.15), rgba(29, 185, 84, 0.08));
            border: 1px solid #1DB954;
            box-shadow: 0 0 28px rgba(29, 185, 84, 0.2), inset 0 0 16px rgba(29, 185, 84, 0.08);
            transform: translateY(-2px);
        }

        .calendar-cell.today {
            background: linear-gradient(135deg, rgba(29, 185, 84, 0.2), rgba(29, 185, 84, 0.1));
            border: 2px solid #1DB954;
            box-shadow: 0 0 40px rgba(29, 185, 84, 0.3), inset 0 0 24px rgba(29, 185, 84, 0.1);
        }

        .calendar-cell.today:hover {
            box-shadow: 0 0 48px rgba(29, 185, 84, 0.4), inset 0 0 28px rgba(29, 185, 84, 0.15);
        }

        .calendar-cell.empty {
            cursor: default;
            background: transparent;
            border: 1px solid transparent;
            border-right: 1px solid rgba(100, 100, 100, 0.1);
            border-bottom: 1px solid rgba(100, 100, 100, 0.1);
        }

        .calendar-cell.empty:hover {
            background: transparent;
            border: 1px solid transparent;
            border-right: 1px solid rgba(100, 100, 100, 0.1);
            border-bottom: 1px solid rgba(100, 100, 100, 0.1);
            transform: none;
            box-shadow: none;
        }

        .calendar-cell.empty:nth-child(7n) {
            border-right: none;
        }

        .cell-number {
            font-size: 16px;
            font-weight: 700;
            color: #b3b3b3;

            font-size: 18px;
            text-shadow: 0 0 12px rgba(29, 185, 84, 0.5);

        .calendar-cell.today .cell-number {

            background: linear-gradient(135deg, #1DB954, #1ed760);

        .cell-icons {

        .cell-icons .green .outline-icon {

            filter: drop-shadow(0 0 8px rgba(29, 185, 84, 0.5));

        .cell-icons .yellow .outline-icon {
            -webkit-text-stroke-color: #ffd700;

        .cell-icons .purple .outline-icon {

        .cell-icons .blue .outline-icon {

        }

        .cell-icons .red .outline-icon {
            -webkit-text-stroke-color: #ff0066;

        /* ==================== MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: rgba(11, 11, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 24px;
            padding: 0;
            max-width: 1500px;
            width: 90vw;
            height: 85vh;
            max-height: 900px;
            animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 255, 136, 0.05);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 20px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            transform: rotate(90deg);
        }

        .modal-header {
            min-height: 112px;
            padding: 26px 40px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: transparent;
            position: relative;
        }

        .modal-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 5%;
            width: 90%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            box-shadow: 0 0 8px #00ff88;
        }

        .modal-icon-wrapper {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .modal-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(20px, 2vw, 30px);
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            line-height: 1.3;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-style: normal;
        }

        .modal-info {
            padding: 24px 32px 32px 32px;
            max-height: calc(85vh - 128px);
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            align-content: start;
            gap: 16px;
        }

        .modal-info::-webkit-scrollbar {
            width: 6px;
        }

        .modal-info::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.3);
            border-radius: 4px;
        }

        .modal-info::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 136, 0.6);
        }

        .promo-section {
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .modal-kpis {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 2px;
            animation: dashboardReveal 0.45s both;
        }

        /* Variante para promociones sin fecha de canje (solo Estado, Inicio y Fin Promoción) */
        .modal-kpis.modal-kpis--compact {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .modal-kpi {
            min-height: 72px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.035);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 8px 24px rgba(0, 0, 0, 0.16);
        }

        .modal-kpi-label {
            display: block;
            margin-bottom: 7px;
            color: #858993;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .modal-kpi-value {
            display: block;
            overflow: hidden;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-info>.promo-section {
            grid-column: span 6;
            min-height: 132px;
            background: rgba(255, 255, 255, 0.035);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: dashboardReveal 0.45s both;
        }

        .modal-info>.promo-section:nth-child(2) {
            animation-delay: 0.06s;
        }

        .modal-info>.promo-section:nth-child(3) {
            animation-delay: 0.12s;
        }

        .modal-info>.promo-section:nth-child(4) {
            animation-delay: 0.18s;
        }

        .modal-info>.promo-section:nth-child(5) {
            animation-delay: 0.24s;
        }

        .modal-info>.promo-section.highlight {
            grid-column: 1 / -1;
            min-height: auto;
        }

        .modal-info>.promo-section.full-width {
            grid-column: 1 / -1;
            min-height: 0;
        }

        @keyframes dashboardReveal {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--at-black);
            background-image:
                radial-gradient(circle at top center, rgba(255, 45, 45, 0.15), transparent 35%),
                radial-gradient(circle at right center, rgba(255, 45, 45, 0.08), transparent 40%),
                radial-gradient(circle at left bottom, rgba(255, 255, 255, 0.03), transparent 30%),
                repeating-linear-gradient(117deg, rgba(255, 255, 255, 0.008) 0 1px, transparent 1px 5px),
                linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
            background-attachment: fixed;
            background-size: 100% 100%, 120% 120%, 100% 100%, auto, 100% 100%;
            animation: ambientBackground 18s ease-in-out infinite alternate;
            color: #f7f7f8;
        }

        @keyframes ambientBackground {
            from {
                background-position: 50% 0%, 100% 50%, 0% 100%, 0 0, 0 0;
            }

            to {
                background-position: 50% 4%, 92% 46%, 4% 94%, 8px 0, 0 0;
            }
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 14vw 18vh rgba(255, 255, 255, 0.16), 82vw 12vh rgba(255, 45, 45, 0.28), 68vw 74vh rgba(255, 255, 255, 0.12), 24vw 86vh rgba(255, 45, 45, 0.16), 92vw 54vh rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: -1;
            animation: ambientDrift 14s ease-in-out infinite alternate;
        }

        body::after {
            width: 1px;
            height: 1px;
            opacity: 0.55;
            transform: translate(9vw, 6vh);
            animation-delay: -6s;
        }

        @keyframes ambientDrift {
            from {
                transform: translate3d(0, 0, 0);
                opacity: 0.65;
            }

            to {
                transform: translate3d(1vw, -1.5vh, 0);
                opacity: 1;
            }
        }
